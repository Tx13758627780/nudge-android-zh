name: 发布首个已签名中文版
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-initial-release.yml']
permissions:
  contents: read
concurrency:
  group: publish-initial-chinese-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Tx13758627780/nudge-android-zh' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v1.19.0-zh.1
    steps:
      - name: Retrieve and verify the locally tested signed APK
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/git/blobs/f56c5e69f0215ac22351529a4605209931243640" --jq .content | base64 --decode > nudge-zh.apk
          printf '%s  nudge-zh.apk\n' '790c36cfd65c69339bb2d074795525b1719cfa26c34e89ada3f14cdca66d903a' > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Upload and publish the prepared release
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/releases/402793262" --jq .tag_name)" = "$RELEASE_TAG"
          test "$(gh api "repos/$GH_REPO/releases/402793262" --jq .draft)" = true
          gh release upload "$RELEASE_TAG" nudge-zh.apk SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
