name: Android 中文版构建

on:
  push:
    branches: [main, localization/zh-CN]
    tags: ['zh-v*']
    paths-ignore: ['extension/**']
  pull_request:
    paths-ignore: ['extension/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check translations
        run: python3 scripts/check-translations.py
      - name: Test, lint and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --console=plain
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nudge-zh-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
            app/build/reports/lint-results-debug.*

  release:
    if: startsWith(github.ref, 'refs/tags/zh-v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure fork signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo '请先按 README.zh-CN.md 配置 KEYSTORE_BASE64 和 KEYSTORE_PASSWORD。'
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > nudge-release.keystore
          cat > keystore.properties <<PROPERTIES
          storeFile=../nudge-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=nudge
          keyPassword=$KEYSTORE_PASSWORD
          PROPERTIES
      - name: Build signed APK
        run: ./gradlew assembleRelease --console=plain
      - name: Publish Chinese APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk nudge-zh.apk
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" nudge-zh.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" nudge-zh.apk \
              --title "Nudge 简体中文版 $GITHUB_REF_NAME" \
              --notes 'Android 简体中文汉化版。独立包名 dev.astraedus.nudge.zh，可与官方版并存。系统语言为简体中文时自动显示中文，其他语言回退为英文。' \
              --verify-tag
          fi
